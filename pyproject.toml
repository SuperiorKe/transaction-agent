[project]
name = "transaction-agent"
version = "0.2.0"
description = "AI agent that phones real service providers and negotiates within user-set authority"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "httpx",
    "anthropic>=1.5.0",
    "google-cloud-speech>=2.40.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not sim and not live'"
markers = [
    "sim: negotiation simulator scenarios against the Anthropic API (needs ANTHROPIC_API_KEY only)",
    "live: calls a real external API such as Anthropic (needs that API's credentials)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
